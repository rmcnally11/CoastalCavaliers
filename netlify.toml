# Coastal Cavaliers — Netlify configuration
# Deploys automatically on every push to main.
# Redeploy trigger: 2026-08-21e hero two-line layout live push.

[build]
  publish = "."
  command = ""

# CACHE POLICY -- read this before changing it.
#
# The previous policy put ALL of /assets/* on a one-year immutable cache.
# site.css and site.js have no content hash in their filenames, so every
# stylesheet and script change shipped between then and 29 July 2026 was
# invisible to anyone who had already loaded the site. `immutable` means the
# browser will not revalidate even on reload.
#
# Images are safe to cache hard: they are stable, and a changed image gets a
# new filename. CSS and JS are hand-edited with no build step or fingerprint,
# so they must revalidate.
#
# If a build step with content hashing is ever added, put css/js back on the
# immutable rule and delete the ?v= strings in the HTML.

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Service workers must NEVER be cached, or a bad one cannot be replaced.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[redirects]]
  from = "/apply"
  to = "/apply.html"
  status = 200

[[redirects]]
  from = "/waitlist"
  to = "/waitlist.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/waitlist.html"
  status = 200

[[redirects]]
  from = "/makers"
  to = "/makers.html"
  status = 200

[[redirects]]
  from = "/marinas"
  to = "/marinas.html"
  status = 200

[[redirects]]
  from = "/sport"
  to = "/sport.html"
  status = 200

[[redirects]]
  from = "/waterdog"
  to = "/waterdog.html"
  status = 200

[[redirects]]
  from = "/chest"
  to = "/#chest"
  status = 302


[[headers]]
  for = "/ops/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, max-age=0"

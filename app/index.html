document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ecure Shopify checkout. The app never sees a card number — that is the whole point.<\u002Fp>\n<div style=\"background:#fff;border:1px solid #E7E3DA;border-radius:18px;padding:16px\">\n<sc-for list=\"{{ attrRows }}\" as=\"a\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;font:400 14px/1.4 Archivo\"><span style=\"color:#8A9088\">{{ a.k }}<\u002Fspan><span style=\"font-weight:500;text-align:right\">{{ a.v }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:12px;background:#EDEAE2;border-radius:14px;padding:14px;font:400 11.5px/1.7 Archivo;color:#767C74;word-break:break-all\">{{ permalink }}<\u002Fdiv>\n<button sc-camel-on-click=\"{{ act.pay }}\" style=\"width:100%;margin-top:16px;padding:17px;background:#1B1E1B;color:#F7F5F1;border:none;border-radius:14px;font:600 15px/1 Archivo;cursor:pointer\">Pay {{ t.t }} →<\u002Fbutton>\n<div style=\"font:400 12.5px/1.6 Archivo;color:#A9AEA6;margin-top:12px;text-align:center\">You come straight back to the app afterwards. Your box is held if anything fails.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.done }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadein .22s ease;padding:34px 18px 26px;text-align:center\">\n<img src=\"c50a6503-deab-4eb1-ad4e-f06c14dc00fb\" alt=\"\" style=\"width:110px;height:110px;object-fit:contain\">\n<div style=\"font:400 32px/1.08 Archivo;letter-spacing:-.03em;margin:16px 0 8px\">Cast off <span style=\"font-weight:700;font-style:italic;color:#D2622A\">well fed.<\u002Fspan><\u002Fdiv>\n<p style=\"font:400 14.5px/1.6 Archivo;color:#767C74;margin:0 0 20px\">We'll text a photo the moment it lands in the cooler.<\u002Fp>\n<div style=\"background:#fff;border:1px solid #E7E3DA;border-radius:18px;padding:16px;text-align:left\">\n<sc-for list=\"{{ confirmRows }}\" as=\"a\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;font:400 14px/1.4 Archivo;border-bottom:1px solid #F1EEE7\"><span style=\"color:#8A9088\">{{ a.k }}<\u002Fspan><span style=\"font-weight:500;text-align:right\">{{ a.v }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:14px;background:#F3EDDF;border-radius:16px;padding:15px 16px;font:400 13.5px/1.6 Archivo;color:#6B5518;text-align:left\">{{ cycleNotice }}<\u002Fdiv>\n<button sc-camel-on-click=\"{{ nav.orders }}\" style=\"width:100%;margin-top:18px;padding:17px;background:#1B1E1B;color:#F7F5F1;border:none;border-radius:14px;font:600 15px/1 Archivo;cursor:pointer\">Add to calendar<\u002Fbutton>\n<button sc-camel-on-click=\"{{ nav.shop }}\" style=\"width:100%;margin-top:10px;padding:16px;background:#fff;border:1px solid #E7E3DA;border-radius:14px;font:500 14.5px/1 Archivo;cursor:pointer\">Start another box<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.orders }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadein .2s ease;padding:20px 18px 26px\">\n<div style=\"font:700 26px/1.1 Archivo;letter-spacing:-.03em\">My orders<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;margin-top:16px\">\n<sc-for list=\"{{ orders }}\" as=\"o\" hint-placeholder-count=\"3\">\n<div style=\"background:#fff;border:1px solid #E7E3DA;border-radius:18px;padding:16px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center\">\n<div style=\"font:600 15.5px/1 Archivo\">{{ o.cycle }}<\u002Fdiv>\n<div style=\"{{ o.chipStyle }}\">{{ o.status }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 13.5px/1.6 Archivo;color:#767C74;margin-top:8px\">{{ o.summary }}<\u002Fdiv>\n<div style=\"display:flex;gap:11px;margin-top:12px;align-items:center\">\n<div style=\"width:66px;height:50px;border-radius:11px;background:#EDEAE2;flex:none\"><\u002Fdiv>\n<div style=\"font:400 12px/1.55 Archivo;color:#8A9088\">{{ o.pod }}<\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ o.reorder }}\" style=\"width:100%;margin-top:13px;padding:14px;background:#F7F5F1;border:1px solid #E7E3DA;border-radius:12px;font:600 14px/1 Archivo;cursor:pointer\">Reorder this box<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ reorderNote }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:12px;background:#F3EDDF;color:#6B5518;border-radius:14px;padding:14px 16px;font:500 13.5px/1.55 Archivo\">{{ reorderNote }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.chest }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadein .2s ease;padding-bottom:26px\">\n<div style=\"padding:20px 18px 0\">\n<div style=\"font:400 30px/1.08 Archivo;letter-spacing:-.03em\">Made ashore.<br><span style=\"font-weight:700;font-style:italic;color:#D2622A\">Enjoyed aboard.<\u002Fspan><\u002Fdiv>\n<p style=\"font:400 14.5px/1.55 Archivo;color:#767C74;margin:9px 0 0\">Merch + extras. The good stuff is members-only.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 0\">\n<sc-for list=\"{{ merch }}\" as=\"m\" hint-placeholder-count=\"6\">\n<div style=\"background:#fff;border:1px solid #E7E3DA;border-radius:18px;overflow:hidden\">\n<div style=\"height:110px;background:#EDEAE2;position:relative\"><div style=\"position:absolute;bottom:8px;left:10px;font:500 9.5px/1 Archivo;letter-spacing:.05em;color:#A9AEA6\">{{ m.imgNote }}<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:13px\">\n<div style=\"font:600 14.5px/1.25 Archivo\">{{ m.n }}<\u002Fdiv>\n<div style=\"font:500 14px/1 Archivo;color:#767C74;margin-top:7px\">{{ m.price }}<\u002Fdiv>\n<button sc-camel-on-click=\"{{ m.act }}\" style=\"{{ m.btnStyle }}\">{{ m.btnLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.membership }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadein .2s ease;padding:20px 18px 26px\">\n<div style=\"font:700 26px/1.1 Archi umn;gap:9px\">\n<button sc-camel-on-click=\"{{ nav.membership }}\" style=\"width:100%;padding:15px 16px;background:#fff;border:1px solid #E7E3DA;border-radius:14px;font:500 14.5px/1 Archivo;cursor:pointer;text-align:left\">Membership &amp; billing →<\u002Fbutton>\n<button sc-camel-on-click=\"{{ nav.waitlist }}\" style=\"width:100%;padding:15px 16px;background:#fff;border:1px solid #E7E3DA;border-radius:14px;font:500 14.5px/1 Archivo;cursor:pointer;text-align:left\">Not in an active cluster? →<\u002Fbutton>\n<button sc-camel-on-click=\"{{ act.roleP }}\" style=\"width:100%;padding:15px 16px;background:#fff;border:1px solid #E7E3DA;border-radius:14px;font:500 14.5px/1 Archivo;cursor:pointer;text-align:left\">Partner with us →<\u002Fbutton>\n<button sc-camel-on-click=\"{{ act.roleOps }}\" style=\"width:100%;padding:15px 16px;background:#fff;border:1px solid #E7E3DA;border-radius:14px;font:500 14.5px/1 Archivo;cursor:pointer;text-align:left\">Crew tools · run sheet →<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"margin-top:14px;font:400 12px/1.5 Archivo;color:#A9AEA6\">{{ installStatus }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.waitlist }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadein .2s ease;padding:20px 18px 26px\">\n<div style=\"font:400 30px/1.08 Archivo;letter-spacing:-.03em\">Not your <span style=\"font-weight:700;font-style:italic;color:#D2622A\">water<\u002Fspan> yet<\u002Fdiv>\n<p style=\"font:400 14.5px/1.6 Archivo;color:#767C74;margin:8px 0 16px;text-wrap:pretty\">We run Clear Lake, Kemah and Seabrook today. Tell us where you keep your boat and we'll read the density.<\u002Fp>\n<sc-if value=\"{{ locUnserved }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fff;border:1px solid #E7E3DA;border-radius:18px;padding:16px;margin-bottom:16px\">\n<div style=\"display:flex;gap:10px;align-items:baseline\">\n<div style=\"font:400 15px/1 Archivo;color:#D2622A\">◎<\u002Fdiv>\n<div style=\"flex:1\">\n<div style= rder:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><option>Sail · cruising<\u002Foption><option>Center console<\u002Foption><option>Sportfish<\u002Foption><option>Trawler<\u002Foption><option>Charter fleet<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin:14px 0 7px\">Email<\u002Fdiv>\n<input value=\"{{ form.email }}\" sc-camel-on-change=\"{{ act.setEmail }}\" placeholder=\"you@example.com\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\">\n<div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin:14px 0 7px\">Your marina<\u002Fdiv>\n<input value=\"{{ form.wlMarina }}\" sc-camel-on-change=\"{{ act.setWlMarina }}\" placeholder=\"Cove Harbor, Rockport\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\">\n<button sc-camel-on-click=\"{{ act.joinWaitlist }}\" style=\"width:100%;margin-top:16px;padding:17px;background:#1B1E1B;color:#F7F5F1;border:none;border-radius:14px;font:600 15px/1 Archivo;cursor:pointer\">Notify me<\u002Fbutton>\n<div style=\"margin-top:12px;font:400 12.5px/1.6 Archivo;color:#A9AEA6\">Waitlist density by zip is how the next cluster gets chosen. This screen is never a dead end.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.hub }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadein .2s ease;padding:20px 18px 26px\">\n<div style=\"font:400 30px/1.08 Archivo;letter-spacing:-.03em\">We bring your work<br><span style=\"font-weight:700;font-style:italic;color:#D2622A\">to the water.<\u002Fspan><\u002Fdiv>\n<p style=\"font:400 14.5px/1.6 Archivo;color:#767C74;margin:10px 0 18px\">Neither way in costs a dollar to start, and no login is required.<\u002Fp>\n<div sc-camel-on-click=\"{{ nav.maker }}\" style=\"background:#fff;border:1px solid #E7E3DA;border-radius:20px;padding:18px;cursor:pointer;margin-bottom:12px\">\n<div style=\"font:600 19px/1.15 Archivo\">Become a maker<\u002Fdiv>\n<p style=\"font:400 14px/1.6 Archivo;color:#767C74;margin:9px 0 0\">Home kitchen or licensed small brand. You set your price, we sell your work to boat owners up and down the coast. No listing fee, ever. Paid every Friday.<\u002Fp>\n<div style=\"font:500 13.5px/1 Archivo;color:#D2622A;margin-top:13px\">Apply →<\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-click=\"{{ nav.marina }}\" style=\"background:#fff;border:1px solid #E7E3DA;border-radius:20px;padding:18px;cursor:pointer\">\n<div style=\"font:600 19px/1.15 Archivo\">Marina partnership<\u002Fdiv>\n<p style=\"font:400 14px/1.6 Archivo;color:#767C74;margin:9px 0 0\">A premium amenity for your slip holders at zero cost and zero work — plus foot traffic past your register. We bring the cooler, the insurance, and the indemnity.<\u002Fp>\n<div style=\"font:500 13.5px/1 Archivo;color:#D2622A;margin-top:13px\">Start the conversation →<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;font:400 12.5px/1.6 Archivo;color:#A9AEA6\">Applications reach the operations desk instantly. Most makers hear back inside 48 hours.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.maker }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadein .2s ease;padding:20px 18px 26px\">\n<div style=\"font:700 26px/1.1 Archivo;letter-spacing:-.03em\">Maker application<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-top:16px\">\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Your name<\u002Fdiv><input value=\"{{ mk.name }}\" sc-camel-on-change=\"{{ act.mkName }}\" placeholder=\"Jane Fulton\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><\u002Fdiv>\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Business name<\u002Fdiv><input value=\"{{ mk.biz }}\" sc-camel-on-change=\"{{ act.mkBiz }}\" placeholder=\"Fulton Bread Co.\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">City / port<\u002Fdiv><input value=\"{{ mk.city }}\" sc-camel-on-change=\"{{ act.mkCity }}\" placeholder=\"Rockport\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><\u002Fdiv>\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Phone<\u002Fdiv><input value=\"{{ mk.phone }}\" sc-camel-on-change=\"{{ act.mkPhone }}\" placeholder=\"(361) 555-0148\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin:16px 0 7px\">Which are you?<\u002Fdiv>\n<div style=\"display:flex;gap:10px\">\n<sc-for list=\"{{ mkTiers }}\" as=\"mt\" hint-placeholder-count=\"2\">\n<button sc-camel-on-click=\"{{ mt.go }}\" style=\"{{ mt.style }}\">{{ mt.label }}<span style=\"display:block;font:400 12px/1 Archivo;margin-top:6px;opacity:.75\">{{ mt.sub }}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ mk.isCottage }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin:16px 0 7px\">DSHS cottage registration #<\u002Fdiv>\n<input value=\"{{ mk.reg }}\" sc-camel-on-change=\"{{ act.mkReg }}\" placeholder=\"CFP-000000\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\">\n<div style=\"margin-top:11px;background:#F3EDDF;border-radius:16px;padding:15px 16px;font:400 13.5px/1.6 Archivo;color:#6B5518\"><b>0% commission for your first 90 days<\u002Fb>, then 15%, stepping to 12.5% at volume. You are never charged to list.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin:16px 0 7px\">What do you make? Include your retail prices.<\u002Fdiv>\n<textarea value=\"{{ mk.items }}\" sc-camel-on-change=\"{{ act.mkItems }}\" placeholder=\"Sourdough boule $9 · Baguette $6 · Focaccia $11\" style=\"width:100%;min-height:84px;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px;resize:vertical\"><\u002Ftextarea>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px\">\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Weekly capacity<\u002Fdiv><input value=\"{{ mk.cap }}\" sc-camel-on-change=\"{{ act.mkCap }}\" placeholder=\"60 loaves\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><\u002Fdiv>\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Delivery or pickup<\u002Fdiv><sc-raw-select style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><option>I can deliver<\u002Foption><option>Please pick up<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;border:1px dashed #D9D4C8;border-radius:16px;background:#fff;padding:22px;text-align:center;font:400 13px/1.6 Archivo;color:#A9AEA6\">Photo upload<br>drop your product shots here<\u002Fdiv>\n<sc-if value=\"{{ mkError }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:12px;background:#F6E5E0;color:#B5462C;border-radius:14px;padding:14px 16px;font:500 13.5px/1.5 Archivo\">Capacity is required — it becomes your order cap.<\u002Fdiv>\n<\u002Fsc-if>\n<button sc-camel-on-click=\"{{ act.submitMaker }}\" style=\"width:100%;margin-top:16px;padding:17px;background:#1B1E1B;color:#F7F5F1;border:none;border-radius:14px;font:600 15px/1 Archivo;cursor:pointer\">Submit application<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.marina }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadein .2s ease;padding:20px 18px 26px\">\n<div style=\"font:700 26px/1.1 Archivo;letter-spacing:-.03em\">Marina partnership<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-top:16px\">\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Marina name<\u002Fdiv><input placeholder=\"Watergate Yachting Center\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Your name<\u002Fdiv><input placeholder=\"Ray Delgado\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><\u002Fdiv>\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Role<\u002Fdiv><input placeholder=\"Harbormaster\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Approx. slips<\u002Fdiv><input placeholder=\"1,000\" style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><\u002Fdiv>\n<div><div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin-bottom:7px\">Ship's store?<\u002Fdiv><sc-raw-select style=\"width:100%;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px\"><option>Yes<\u002Foption><option>No<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin:16px 0 7px\">Drop point you could offer<\u002Fdiv>\n<div style=\"display:flex;gap:10px\">\n<sc-for list=\"{{ drops }}\" as=\"d\" hint-placeholder-count=\"3\">\n<button sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\">{{ d.label }}<span style=\"display:block;font:400 11.5px/1 Archivo;margin-top:6px;opacity:.75\">{{ d.sub }}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font:500 12.5px/1 Archivo;color:#8A9088;margin:16px 0 7px\">Anything we should know?<\u002Fdiv>\n<textarea placeholder=\"Gate access, storm protocol, event calendar…\" style=\"width:100%;min-height:84px;padding:14px;border:1px solid #E7E3DA;border-radius:12px;background:#fff;font-size:14.5px;resize:vertical\"><\u002Ftextarea>\n<div style=\"margin-top:12px;background:#E9EFEA;border-radius:16px;padding:15px 16px;font:400 13.5px/1.6 Archivo;color:#3F6B55\">You pay nothing. Choose a flat staging fee, a per-box fee, or take it as a free amenity with comp boxes for your team. Our product liability names you additional insured.<\u002Fdiv>\n<button sc-camel-on-click=\"{{ act.submitMarina }}\" style=\"width:100%;margin-top:16px;padding:17px;background:#1B1E1B;color:#F7F5F1;border:none;border-radius:14px;font:600 15px/1 Archivo;cursor:pointer\">Request a 15-minute visit<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is.sent }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadein .22s ease;padding:44px 20px 26px;text-align:center\">\n<img src=\"c50a6503-deab-4eb1-ad4e-f06c14dc00fb\" alt=\"\" style=\"width:100px;height:100px;object-fit:contain\">\n<div style=\"font:700 28px/1.12 Archivo;letter-spacing:-.03em;margin:16px 0 10px\">Received.<\u002Fdiv>\n<p style=\"font:400 14.5px/1.65 Archivo;color:#767C74;margin:0;text-wrap:pretty\">{{ sentLine }}<\u002Fp>\n<div style=\"margin-top:20px;background:#fff;border:1px solid #E7E3DA;border-radius:18px;padding:16px;text-align:left;font:400 13.5px/2 Archivo;color:#767C74\">Confirmation text sent<br>Operator alerted with the record link<br>Reply inside 48 hours<\u002Fdiv>\n<button sc-camel-on-click=\"{{ nav
